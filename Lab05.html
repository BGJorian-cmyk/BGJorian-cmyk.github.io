<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exploring HTML forms</title>
</head>
<body>
    <!-- This is a practice page for Lab 5.  Cut and paste notes from w3schools.com  -->
    <!-- GET appends your data to the URL.  For passwords do not use GET change to POST-->
    <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">

      
          <h1>Volunteer Form</h1>
          <fieldset>
            <legend>My Info</legend>
            <div>
            <!-- Text types can be used for names -->
            <!-- Placeholder gives an example/default -->
            <!-- Required will not allow you to submit if it is blank -->
            <!-- FIRST NAME -->
            <label for="first name">first name:</label>
            <input type="text" id="first name" name="first_name_field" placeholder="John" required><br>
        </div>
        <br>
        <div>
            <!-- LAST NAME -->
             <label for="last name">last name:</label>
             <input type="text" id="first name" name="last_name_field" placeholder="Doe" required>

        </div>
        <br>
        <div>
            <!-- Email type will require an @ symbol -->
        <!-- Use placeholder hello@world -->
            <label for="email"> email: </label>
            <input type="email" id="email" name="email_field" placeholder="hello@world">
        
        </div>
        <br>

        <div>
          <!-- Tel type is used for phone#.  We will not require this value --> 
          <label for="phone"> phone#: </label>
          <input type="phone" id="phone" name="phone_field" placeholder="(123)456-7899" >
        </div>
        <br>

        <div>
         <!-- Radio buttons. Provide the same group name to force selection of only one --> 
          <label for="Gender"> Gender: </label>
          <label for="BS"> Male </label>
          <input type="radio" name="gender_field" value="Male">
          <label for="MS"> Female </label>
          <input type="radio" name="gender_field" value="Female">
        </div>
        <br>

        <div>
        <!-- Provide the same group name to force selection of only one -->
        <!-- Dropdown menu use a select instead of an input type-->
        <!-- Dropdown menu use a select instead of a input type--> 
          <label for="Age"> Age: </label>
            <select id="Age" name="age_field">
            <option value="under 18">under 18</option>
            <option value="above 18">above 18</option>
            </select>
        </div>
        <br></fieldset>
        <fieldset>
        <legend>My Availability</legend>
        <h2>Days available</h2>
        <div>
        <!-- Checkbox --> 
        <!-- Checkbox type can be used for a subscribe box --> 
        <label for="Sunday"> Sunday: </label>
        <input type="checkbox" id="Sunday" name="available_field[]" value="Sunday"><br>
        <label for="Monday"> Monday: </label>
        <input type="checkbox" id="Monday" name="available_field[]" value="Monday"><br>
        <label for="Tuesday"> Tuesday: </label>
        <input type="checkbox" id="Tuesday" name="available_field[]" value="Tuesday"><br>
        <label for="Wednesday"> Wednesday: </label>
        <input type="checkbox" id="Wednesday" name="available_field[]" value="Wednesday"><br>
        <label for="Thursday"> Thursday: </label>
        <input type="checkbox" id="Thursday" name="available_field[]" value="Thursday"><br>
        <label for="Friday"> Friday: </label>
        <input type="checkbox" id="Friday" name="available_field[]" value="Friday"><br>
        <label for="Saturday"> Saturday: </label>
        <input type="checkbox" id="Saturday" name="available_field[]" value="Saturday"><br>
        </div>
        
        <h2>Comments</h2>
        <div>
            <!-- This will be the comment box -->
            <textarea name=" comments_field" rows="3" cols="20">
                
            </textarea>
        </div>
        </fieldset>
 <!-- This will reset our input box -->
        <br>
        <div>

            <!-- This will submit the content -->
              <input type="Submit">
        </div>

        <!-- This is for the hidden field that the user does not see -->
          <input type="hidden" name="hidden_field" value="JorianHouston"> 
    </form>
</body>
</html>
